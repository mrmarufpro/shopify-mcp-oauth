name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      # No `version:` input on purpose. The action reads the pnpm version from the
      # root package.json's `packageManager` field, and it errors out if an input
      # disagrees with that field -- which `version: 10` does, against pnpm@10.34.5.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The example imports the package through its exports map, which points at dist/.
      - run: pnpm build

      - run: pnpm lint

      - run: node scripts/check-package-metadata.mjs

      - run: pnpm typecheck

      - run: pnpm test

      # Proves the scaffold template still generates cleanly from the example.
      - run: pnpm sync:template

      - name: Fail if the generated template does not pin the current library version
        run: node scripts/check-template-pin.mjs
